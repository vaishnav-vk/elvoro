<div class="admin-container">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="brand">
      <h2>ELVORO</h2>
      <span>ADMIN PANEL</span>
    </div>

    <div class="menu-label">MAIN MENU</div>

    <nav class="sidebar-menu">

      <a routerLink="/admin"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        <span>▦</span>
        Dashboard
      </a>

      <a routerLink="/admin/products" routerLinkActive="active">
        <span>▣</span>
        Products
      </a>

      <a routerLink="/admin/orders" routerLinkActive="active">
        <span>▤</span>
        Orders
      </a>

      <a routerLink="/admin/customers" routerLinkActive="active">
        <span>♙</span>
        Customers
      </a>

      <a routerLink="/admin/discounts" routerLinkActive="active">
        <span>％</span>
        Discounts
      </a>

      <a routerLink="/admin/settings" routerLinkActive="active">
        <span>⚙</span>
        Settings
      </a>

    </nav>

    <!-- Admin Profile & Logout -->
    <div class="sidebar-bottom">

      <div class="admin-profile">
        <div class="avatar">A</div>

        <div>
          <strong>{{ adminName }}</strong>
          <small>Administrator</small>
        </div>
      </div>

      <button class="logout-btn" (click)="logout()">
        Logout
      </button>

    </div>

  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <header class="topbar">

      <div>
        <h3>{{pageTitle}}</h3>
        <p>Welcome back,elvoro</p>
      </div>

      <div class="topbar-right">
        <span class="admin-badge">ADMIN</span>
      </div>

    </header>

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>

  </main>

</div>


<!-- Logout Confirmation Modal -->
@if (showLogoutModal) {

  <div class="logout-overlay" (click)="cancelLogout()">

    <div class="logout-modal" (click)="$event.stopPropagation()">

      <!-- Warning Icon -->
      <div class="warning-icon">
        !
      </div>

      <!-- Modal Heading -->
      <h2>Logout Confirmation</h2>

      <!-- Modal Message -->
      <p>
        Are you sure you want to log out of your Elvoro Admin account?
      </p>

      <!-- Modal Buttons -->
      <div class="modal-actions">

        <button
          class="cancel-btn"
          (click)="cancelLogout()">
          Cancel
        </button>

        <button
          class="confirm-btn"
          (click)="confirmLogout()">
          Yes, Logout
        </button>

      </div>

    </div>

  </div>

}
